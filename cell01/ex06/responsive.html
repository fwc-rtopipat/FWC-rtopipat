<!DOCTYPE html>
<html>
<head>
    <title>Responsive Table</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        table {
            width: 100%;
            height: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }

        td {
            width: 50%;
            height: 100%;
            padding: 20px;
            text-align: center;
            vertical-align: middle;
            font-size: clamp(12px, 5vw, 60px);
        }

        td:first-child {
            background-color: darkkhaki;
            border: 1px solid black;
            border-right: 0;
        }

        td:last-child {
            background-color: lightsalmon;
            border: 1px solid black;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td>First cell</td>
            <td>Second cell</td>
        </tr>
    </table>

</body>
</html>
