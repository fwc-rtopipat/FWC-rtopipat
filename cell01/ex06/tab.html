<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tab</title>

    <style>
        table {
            width: 100%;
            height: 200px;
            border-collapse: collapse;
        }

        td {
            text-align: center;
            font-size: 30px;
            border: 1px solid black;
        }

        .box1 {
            background-color: lightblue;
        }

        .box2 {
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td class="box1">Hello</td>
            <td class="box2">World</td>
        </tr>
    </table>

</body>

</html>
